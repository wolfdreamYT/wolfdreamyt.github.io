<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WolfStudios - The Archives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="archives.css">
  <link rel="stylesheet" href="global1.css">
  <link rel="stylesheet" href="global2.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
      <a href="/" class="brand">
          <div class="brand-logo">
            <img src="assets/images/logo.png" alt="Wolf Studios">
          </div>

          <div class="brand-text">
              <span class="brand-name">Wolf Studios</span>
              <span class="brand-tagline">Inventing products like animals.</span>
          </div>
      </a>

      <nav class="main-nav" id="mainNav">
            <a href="/index.html">Home</a>
            <a href="/browser.html">Browser</a>
            <a href="/media.html">Media</a>
            <a href="/archives.html">Archives</a>
            <a href="/chat.html">WAI2B</a>
            <a id="discordRedirect" target="_blank">Support</a>
            <a class="nav-contribute" id="youtubeRedirect" target="_blank">Youtube</a>
      </nav>

      <button class="mobile-menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
      </button>
  </header>

  <header class="masthead">
    <div class="masthead-inner">
      <h1>The Archives</h1>
      <p class="subtitle">WolfStudios Music Archives</p>
      <div class="masthead-meta">
        <span id="entry-count">- entries</span>
        <span class="divider">·</span>
        <span id="entry-span">-</span>
      </div>
    </div>
  </header>

  <div class="control-strip">
    <input type="text" id="search" placeholder="Search title, artist, album…" autocomplete="off">
    <select id="sort-by">
      <option value="artist">Sort: Artist</option>
      <option value="title">Sort: Title</option>
      <option value="year-desc">Sort: Newest</option>
      <option value="year-asc">Sort: Oldest</option>
      <option value="genre">Sort: Genre</option>
    </select>
    <select id="filter-genre">
      <option value="">All Genres</option>
    </select>
  </div>

  <main id="archive-body">
    <div id="loading-state" class="status-line">Pulling the ledger off the shelf…</div>
    <div id="empty-state" class="status-line" hidden>No entries match. The archive is judging your search terms.</div>
    <div id="archive-list"></div>
  </main>

  <footer class="colophon">
    <p>2026 WolfStudios</p>
  </footer>

  <script src="archives.js"></script>
  <script src="redirects.js"></script>
</body>
</html>
